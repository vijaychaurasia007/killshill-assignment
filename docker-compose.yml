version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: killshill-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: killshill

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: killshill-backend
    restart: unless-stopped
    ports:
      - '4001:4001'
    environment:
      MONGODB_URI: mongodb://mongo:27017/killshill
      PORT: 4001
      NODE_ENV: production
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: killshill-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  mongo_data:
